<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Misophonia 🎃</title>
  <meta name="description" content="Trick or treat! Pick a mystery candy and get a random (annoying) sound.">
  <!-- Link previews on X, Facebook, LinkedIn and Threads (these need absolute URLs) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Misophonia">
  <meta property="og:title" content="Misophonia: a Halloween candy bowl of hated sounds 🎃">
  <meta property="og:description" content="Pick a mystery candy… and hear a sound you hate. How many can you survive?">
  <meta property="og:url" content="https://misophonia.florque.com/">
  <meta property="og:image" content="https://misophonia.florque.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A glowing jack-o'-lantern bowl full of wrapped candy on a candle-lit table">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage" aria-label="A bowl of mystery candy"></main>

  <header class="hud hud-title">
    <h1>Miso<span>phonia</span></h1>
    <p id="hint">Pick a candy… if you dare 🎃</p>
  </header>

  <div class="hud hud-actions">
    <button id="mute" title="Mute / unmute" aria-pressed="false">🔊</button>
    <button id="refill" aria-label="Refill bowl"><span aria-hidden="true">🍬</span><span class="btn-label"> Refill bowl</span></button>
    <button id="share-open" aria-label="Share"><span aria-hidden="true">📣</span><span class="btn-label"> Share</span></button>
  </div>

  <div class="hud hud-count">
    <strong id="left">13</strong> candies left
    <span class="keys">· <kbd>Space</kbd> grabs a random one</span>
  </div>

  <aside class="hud hud-loot">
    <h2>Your loot</h2>
    <ol id="history"></ol>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="share" aria-labelledby="share-title">
    <div class="share-panel">
      <form method="dialog"><button class="share-close" aria-label="Close">✕</button></form>
      <h2 id="share-title">Brag about it 🎃</h2>
      <label for="share-text">Your message (edit it if you like)</label>
      <textarea id="share-text" rows="4"></textarea>
      <div class="share-buttons">
        <button data-share="x" class="share-x">𝕏 Post on X</button>
        <button data-share="facebook" class="share-facebook">Facebook</button>
        <button data-share="linkedin" class="share-linkedin">LinkedIn</button>
        <button data-share="threads" class="share-threads">Threads</button>
      </div>
      <div class="share-more">
        <button data-share="copy">📋 Copy text + link</button>
        <button data-share="native" hidden>📤 More…</button>
      </div>
      <p id="share-status" role="status"></p>
    </div>
  </dialog>
  <div id="loading">Summoning candy…</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
